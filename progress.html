<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Veilforge — Live Progress</title>
  <style>
    :root {
      --ink: #0b0e18;
      --panel: #14182a;
      --gold: #e0b15a;
      --mist: #9aa4c7;
      --ok: #6ee7b7;
      --warn: #fbbf24;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1c2450 0%, var(--ink) 55%);
      color: #e8ecff;
      min-height: 100vh;
      min-height: 100dvh;
    }
    header {
      padding: 28px 32px 8px;
      padding-top: max(28px, env(safe-area-inset-top));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      border-bottom: 1px solid #2a3358;
    }
    h1 { margin: 0; font-weight: 650; letter-spacing: 0.08em; color: var(--gold); }
    .tag { color: var(--mist); max-width: 820px; }
    .meta { font-size: 13px; color: #7d87ad; margin-top: 8px; }
    main {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }
    .card {
      background: var(--panel);
      border: 1px solid #2d365c;
      border-radius: 14px;
      padding: 16px 18px;
    }
    .piece { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #232a48; }
    .piece:last-child { border-bottom: 0; }
    .status { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; flex: 0 0 auto; }
    .building { color: var(--warn); }
    .ok { color: var(--ok); }
    .fail { color: var(--bad); }
    .queued { color: #7d87ad; }
    a { color: var(--gold); }
    ul { padding-left: 18px; color: #c5cce8; }
    .cmp { margin: 8px 0; font-size: 14px; }
    .cmp strong { color: var(--gold); font-weight: 650; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; padding: 16px; }
      header { padding: 20px 16px 8px; padding-top: max(20px, env(safe-area-inset-top)); }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>VEILFORGE</h1>
    <p class="tag" id="tagline">Loading…</p>
    <p class="meta">
      <a href="index.html">Open the game</a>
      · <a id="live" href="https://teabonetv.github.io/veilforge/">Live playtest</a>
      · Wave <span id="wave">–</span>
      · Updated <span id="updated">–</span>
    </p>
  </header>
  <main>
    <section class="card">
      <h2>Pieces</h2>
      <div id="pieces"></div>
    </section>
    <section>
      <div class="card" style="margin-bottom:16px">
        <h2>Blind comparison</h2>
        <p id="overall"></p>
        <p class="cmp">Melvor Idle: <strong id="m1">–</strong></p>
        <p class="cmp">Melvor Idle 2: <strong id="m2">–</strong></p>
        <p class="cmp">RuneScape: <strong id="rs">–</strong></p>
        <p class="cmp">Ours better: <strong id="better">–</strong></p>
        <p class="cmp">Biggest gap: <strong id="gap">–</strong></p>
      </div>
      <div class="card">
        <h2>Log</h2>
        <ul id="log"></ul>
      </div>
    </section>
  </main>
  <script>
    async function refresh() {
      const res = await fetch("progress.json?t=" + Date.now());
      const d = await res.json();
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v ?? ""; };
      set("tagline", d.tagline);
      set("wave", d.wave);
      set("updated", d.updatedAt);
      set("overall", d.overall);
      set("m1", d.comparison.melvorIdle);
      set("m2", d.comparison.melvorIdle2);
      set("rs", d.comparison.runescape || "–");
      set("better", String(d.comparison.oursBetter));
      set("gap", d.comparison.biggestGap);
      const live = document.getElementById("live");
      if (live && d.play) live.href = d.play;
      const pieces = document.getElementById("pieces");
      if (pieces) {
        pieces.textContent = "";
        for (const p of d.pieces || []) {
          const row = document.createElement("div");
          row.className = "piece";
          const left = document.createElement("div");
          const strong = document.createElement("strong");
          strong.textContent = p.name;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = p.critic || "";
          left.append(strong, meta);
          const st = document.createElement("div");
          const cls = p.status === "wow" || p.status === "done" ? "ok" : p.status === "fail" ? "fail" : p.status === "building" ? "building" : "queued";
          st.className = "status " + cls;
          st.textContent = p.status;
          row.append(left, st);
          pieces.append(row);
        }
      }
      const log = document.getElementById("log");
      if (log) {
        log.textContent = "";
        for (const x of (d.log || []).slice().reverse()) {
          const li = document.createElement("li");
          li.textContent = x;
          log.append(li);
        }
      }
    }
    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
