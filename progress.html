<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veilforge — Live Progress</title>
  <style>
    :root {
      --ink: #0b0e18;
      --panel: #14182a;
      --gold: #e0b15a;
      --mist: #9aa4c7;
      --ok: #6ee7b7;
      --warn: #fbbf24;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1c2450 0%, var(--ink) 55%);
      color: #e8ecff;
      min-height: 100vh;
    }
    header {
      padding: 28px 32px 8px;
      border-bottom: 1px solid #2a3358;
    }
    h1 { margin: 0; font-weight: 650; letter-spacing: 0.08em; color: var(--gold); }
    .tag { color: var(--mist); max-width: 820px; }
    .meta { font-size: 13px; color: #7d87ad; margin-top: 8px; }
    main { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; padding: 24px; }
    .card {
      background: var(--panel);
      border: 1px solid #2d365c;
      border-radius: 14px;
      padding: 16px 18px;
    }
    .piece { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #232a48; }
    .piece:last-child { border-bottom: 0; }
    .status { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    .building { color: var(--warn); }
    .ok { color: var(--ok); }
    .fail { color: var(--bad); }
    .queued { color: #7d87ad; }
    a { color: var(--gold); }
    ul { padding-left: 18px; color: #c5cce8; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>VEILFORGE</h1>
    <p class="tag" id="tagline">Loading…</p>
    <p class="meta"><a href="index.html">Open the game</a> · Wave <span id="wave">–</span> · Updated <span id="updated">–</span></p>
  </header>
  <main>
    <section class="card">
      <h2>Pieces</h2>
      <div id="pieces"></div>
    </section>
    <section>
      <div class="card" style="margin-bottom:16px">
        <h2>Blind comparison</h2>
        <p id="overall"></p>
        <p>Melvor Idle: <strong id="m1">–</strong></p>
        <p>Melvor Idle 2: <strong id="m2">–</strong></p>
        <p>Ours better: <strong id="better">–</strong></p>
        <p>Biggest gap: <strong id="gap">–</strong></p>
      </div>
      <div class="card">
        <h2>Log</h2>
        <ul id="log"></ul>
      </div>
    </section>
  </main>
  <script>
    async function refresh() {
      const res = await fetch("/progress.json?t=" + Date.now());
      const d = await res.json();
      document.getElementById("tagline").textContent = d.tagline;
      document.getElementById("wave").textContent = d.wave;
      document.getElementById("updated").textContent = d.updatedAt;
      document.getElementById("overall").textContent = d.overall;
      document.getElementById("m1").textContent = d.comparison.melvorIdle;
      document.getElementById("m2").textContent = d.comparison.melvorIdle2;
      document.getElementById("better").textContent = String(d.comparison.oursBetter);
      document.getElementById("gap").textContent = d.comparison.biggestGap;
      document.getElementById("pieces").innerHTML = d.pieces.map(p => {
        const cls = p.status === "wow" || p.status === "done" ? "ok" : p.status === "fail" ? "fail" : p.status === "building" ? "building" : "queued";
        return `<div class="piece"><div><strong>${p.name}</strong><div class="meta">${p.critic || ""}</div></div><div class="status ${cls}">${p.status}</div></div>`;
      }).join("");
      document.getElementById("log").innerHTML = (d.log || []).slice().reverse().map(x => `<li>${x}</li>`).join("");
    }
    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
