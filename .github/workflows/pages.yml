# Deploy the static game to GitHub Pages on every push to main.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage playable files
        run: |
          mkdir -p dist
          cp -a index.html css js branding sw.js manifest.webmanifest progress.html progress.json README.md .nojekyll dist/
          # Pages serves from /veilforge/; keep relative URLs.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: out
        uses: actions/deploy-pages@v4
